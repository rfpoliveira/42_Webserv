ServerBlock {
    listen 8080;
    # listen at port 8080
    host 127.0.0.1;
    # interface specifing
    ServerBlock_name hello.com;

    client_maxBodySize 10M;

    error_page 404 ./test/error/404.html;
    error_page 500 ./test/error/500.html;

    # home page
    location / {
        root ./test/var/www/html;
        allow_methods GET;
        # only allow get
        index index.html;
        # default file if it is a directory request
        autoindex off;
        # dont list files if index not found
    }

    # diretiory for static images
    location /images {
        root ./test/var/www/data;
        allow_methods GET;
        autoindex on;
        # turn on directory listing
    }

    # redirection exemple old page to images
    location /old-page {
        return 301 ./test/images;
    }

    # file upload
    location /upload {
        allow_methods POST;
        upload_path ./test/tmp/upload;
        # where to upload the files
    
    }
    location /delete {
        root ./test/tmp/upload
        allow_methods DELETE;
    }   
}

