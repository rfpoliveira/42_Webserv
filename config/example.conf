# ==========================================================
# Example config for webserv — matches your current parser
# ==========================================================
# Server-context directives your parser recognizes:
#   listen, host, server_name, client_maxBodySize,
#   error_page, location { ... }
# Location-context directives your parser recognizes:
#   root, allow_methods, index, autoindex, return, upload_path
# ==========================================================

server {
    listen 8081;                 # port  (must be > 0)
    host 127.0.0.1;              # IPv4 or "localhost"
    server_name example.com;

    client_maxBodySize 10M;   # accepts K / M / G suffixes

    error_page 404 /error/404.html;   # code 300-599, path must start with '/'
    error_page 500 /error/500.html;

    # Home page — static GET only
    location / {
        root /var/www/html;
        allow_methods GET;
        index index.html;
        autoindex off;
    }

    # Image directory with directory listing on
    location /images {
        root /var/www/data;
        allow_methods GET;
        autoindex on;
    }

    # Redirection: your parser stores tokens.at(2) as the target,
    # so the format is:  return <code> <target>;
    location /old-page {
        root /var/www/html;
        return 301 /images;
    }

    # File upload endpoint
    location /upload {
        root /var/www/html;
        allow_methods POST;
        upload_path /tmp/upload;
    }

    # Delete endpoint
    location /delete {
        root /tmp/upload;
        allow_methods DELETE;
    }
}

# A second virtual server on another port
server {
    listen 8081;
    host 127.0.0.1;
    server_name second.com;

    client_maxBodySize 5M;

    location / {
        root /var/www/html;
        allow_methods GET POST DELETE;   # multiple methods space-separated
        index index.html;
        autoindex off;
    }
}
