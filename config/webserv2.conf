server
{
	listen 8080;
	# listen at port 8080
	host 127.0.0.1;
	# interface specifing
	server_name hello.com;

	client_max_body_size 10M;

	error_page 404 /error/404.html;
	error_page 500 /error/500.html;

	# home page
	location / {
		root /var/www/html;
		allow_methods GET;
		# only allow get
		index index.html;
		# default file if it is a directory request
		autoindex off;
		# dont list files if index not found
	}
}
